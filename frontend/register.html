<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Smart Task Manager account to start organizing tasks with intelligent priority tracking.">
    <title>Create Account — Smart Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.15) 0%, rgba(11, 15, 25, 1) 70%);">

    <div class="glass-surface animate-slide-up" style="width: 100%; max-width: 440px; padding: var(--space-5); box-shadow: var(--shadow-lg), var(--shadow-glow);">
        <!-- App Logo & Header -->
        <div style="text-align: center; margin-bottom: var(--space-4);">
            <div class="brand-icon" style="width: 48px; height: 48px; font-size: 1.5rem; margin: 0 auto var(--space-2); border-radius: var(--radius-lg); background: linear-gradient(135deg, var(--accent-secondary) 0%, var(--accent-primary) 100%);">🚀</div>
            <h1 style="font-size: var(--text-2xl); font-weight: 700; color: var(--text-primary);">Create Your Workspace</h1>
            <p style="font-size: var(--text-sm); color: var(--text-secondary); margin-top: var(--space-1);">Join thousands of users organizing tasks efficiently</p>
        </div>

        <!-- Registration Form -->
        <form id="register-form" style="display: flex; flex-direction: column; gap: var(--space-2_5);">
            <div class="form-group">
                <label for="name" class="input-label">Full Name</label>
                <div class="input-icon-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="name" class="input-field" placeholder="Alex Morgan" required autocomplete="name">
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="input-label">Work Email</label>
                <div class="input-icon-wrapper">
                    <span class="input-icon">✉</span>
                    <input type="email" id="email" class="input-field" placeholder="alex@company.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="input-label">Password (min 8 characters)</label>
                <div class="input-icon-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" class="input-field" placeholder="••••••••" required minlength="8" autocomplete="new-password">
                </div>
            </div>

            <p id="error-message" class="input-error" style="min-height: 18px; text-align: center;"></p>

            <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: var(--space-1); background: linear-gradient(135deg, var(--accent-secondary) 0%, var(--accent-primary) 100%);">
                <span>Create Account</span>
            </button>
        </form>

        <!-- Footer link -->
        <p style="text-align: center; font-size: var(--text-sm); color: var(--text-secondary); margin-top: var(--space-4);">
            Already have an account? <a href="login.html" style="font-weight: 600; text-decoration: underline;">Sign in here</a>
        </p>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
